name: Build ram_mesh_import.exe

on:
  push:
    paths:
      - "ram_mesh_import/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ram_mesh_import
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build exe
        run: >
          pyinstaller --onefile --console --name ram_mesh_import
          --collect-all ezdxf --collect-all shapely
          --hidden-import ram_mesh_import.concept_builder
          entry.py

      - name: Smoke test exe
        run: |
          .\dist\ram_mesh_import.exe examples\sample_level.dxf --dry-run --work-dir smoke
          if (-not (Test-Path smoke\sample_level_dashboard.html)) { exit 1 }

      - name: Assemble package
        run: |
          New-Item -ItemType Directory -Force pkg\ram_mesh_import\examples | Out-Null
          Copy-Item dist\ram_mesh_import.exe pkg\ram_mesh_import\
          Copy-Item windows_dist\* pkg\ram_mesh_import\
          Copy-Item examples\config.example.json pkg\ram_mesh_import\config.json
          Copy-Item examples\sample_level.dxf pkg\ram_mesh_import\examples\
          Copy-Item README.md pkg\ram_mesh_import\
          Compress-Archive -Path pkg\ram_mesh_import -DestinationPath ram_mesh_import_windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ram_mesh_import_windows
          path: ram_mesh_import/ram_mesh_import_windows.zip

      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ram-mesh-import-build-${{ github.run_number }}"
          gh release create "$tag" ram_mesh_import_windows.zip \
            --title "ram_mesh_import Windows build ${{ github.run_number }}" \
            --notes "Standalone Windows build (no Python needed). Unzip, then drag a DXF onto dry_run.bat or build.bat. Built from ${{ github.sha }}." \
            --latest
